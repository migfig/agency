[project]
name = "agency"
version = "0.1.0"
description = "CLI + API platform for orchestrating AI agent workflows on local hardware"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "docker>=7",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "nvidia-ml-py>=13.610.43",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml",
    "textual>=1.0.0",
    "uvicorn>=0.52.4",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.3",
]
gpu = [
    "pynvml>=11.0",
]

[project.scripts]
agency = "agency.cli.commands:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "tiktoken>=0.13.0",
]
