name: dspy_generate_lint_run
entry_point: generate

models:
  draft:
    endpoint: http://127.0.0.1:8100
    path: gemma-4-12b-it-UD-Q4_K_XL.gguf
    vram_size: 12GB
    startup_timeout: 300.0
    timeout_seconds: 600.0

tools:
  save_program:
    kind: file_write
    path: "programs/{name}.py"
    description: "Save generated code to programs/<name>.py"
  lint_python:
    kind: shell
    command: "ruff check {file}"
    description: "Lint a Python file with ruff"
  run_python:
    kind: program
    program: "{file}"
    description: "Run a Python script file"

nodes:
  generate:
    id: generate
    type: agent
    model: draft
    prompt_template: >
      # DSPy Blog Post Generator — Code Generation Context

      ## Task

      Generate a single-file Python program: a 3-stage DSPy pipeline (Writer → Reviewer → Editor) that produces markdown blog posts via a local llama.cpp server, with streaming Rich UI feedback and CLI arguments.

      ## Architecture

      ```
      [CLI] → [Server Manager] → [BlogPostPipeline]
                                          │
                                          ├─ WriterSig   (topic, audience, tone, length → draft)
                                          ├─ ReviewerSig (draft, audience, tone → feedback)
                                          └─ EditorSig   (draft, feedback → final_post)
                                          │
                                          → [Rich Live Display] → [save_post] → blogs/*.md
      ```

      ## File Structure

      ```
      1. Imports (stdlib → third-party → local; blank line between groups)
      2. load_dotenv() at module level (try/except pass)
      3. console = Console() at module level
      4. Utility functions: wait_for_server, start_server, stop_server, save_post
      5. RichStatusMessageProvider class
      6. dspy.Signature classes: WriterSig, ReviewerSig, EditorSig
      7. BlogPostPipeline(dspy.Module) with __init__, _setup_streaming, _run_streaming_stage, generate_post
      8. parse_args() with argparse
      9. main() with try/except/finally
      10. if __name__ == "__main__": main()
      ```

      ## Code Style

      - `snake_case` functions/vars, `PascalCase` classes, `SCREAMING_SNAKE_CASE` constants
      - Annotate all parameters and return values using `list[str]`, `dict[str, str]` (not `List`/`Dict`)
      - f-strings for interpolation
      - No docstrings, no inline comments
      - `try/except` with specific types; `KeyboardInterrupt` handled separately; `finally` for cleanup

      ## Signatures

      ```python
      class WriterSig(dspy.Signature):
          """Generate a structured blog post draft matching the given topic, audience, tone, and length constraints."""
          topic: str = dspy.InputField()
          audience: str = dspy.InputField()
          tone: str = dspy.InputField()
          length: str = dspy.InputField()
          draft: str = dspy.OutputField(desc="A well-structured blog post draft in markdown")

      class ReviewerSig(dspy.Signature):
          """Review the draft for tone alignment, audience relevance, and structural quality."""
          draft: str = dspy.InputField()
          audience: str = dspy.InputField()
          tone: str = dspy.InputField()
          feedback: str = dspy.OutputField(desc="Constructive feedback on tone mismatches, audience drift, and structural improvements")

      class EditorSig(dspy.Signature):
          """Incorporate reviewer feedback into the draft to produce a polished final post."""
          draft: str = dspy.InputField()
          feedback: str = dspy.InputField()
          final_post: str = dspy.OutputField(desc="The final polished blog post in markdown format")
      ```

      ## Pipeline Module

      ```python
      class BlogPostPipeline(dspy.Module):
          def __init__(self):
              super().__init__()
              self.writer = dspy.Predict(WriterSig)
              self.reviewer = dspy.Predict(ReviewerSig)
              self.editor = dspy.Predict(EditorSig)
              self._setup_streaming()

          def _setup_streaming(self):
              self.stream_writer = dspy.streamify(
                  self.writer,
                  stream_listeners=[dspy.streaming.StreamListener(signature_field_name="draft")],
                  status_message_provider=RichStatusMessageProvider(),
                  async_streaming=False,
              )
              self.stream_reviewer = dspy.streamify(
                  self.reviewer,
                  stream_listeners=[dspy.streaming.StreamListener(signature_field_name="feedback")],
                  status_message_provider=RichStatusMessageProvider(),
                  async_streaming=False,
              )
              self.stream_editor = dspy.streamify(
                  self.editor,
                  stream_listeners=[dspy.streaming.StreamListener(signature_field_name="final_post")],
                  status_message_provider=RichStatusMessageProvider(),
                  async_streaming=False,
              )

          def _run_streaming_stage(self, stream_generator, progress, task_id, live):
              buffers = {}
              for chunk in stream_generator:
                  if isinstance(chunk, dspy.streaming.StreamResponse):
                      field = chunk.signature_field_name
                      buffers.setdefault(field, "")
                      buffers[field] += chunk.chunk
                      live.update(Text(buffers[field][-800:], style="cyan"), refresh=True)
                  elif isinstance(chunk, dspy.Prediction):
                      progress.update(task_id, completed=100)
                      return chunk
              return None

          def generate_post(self, topic: str, audience: str, tone: str, length: str) -> str:
              # Run all 3 stages sequentially with streaming + Rich Progress/Live display
              # Pass output from one stage to the next
              # Return final_post or empty string on failure
      ```

      ## Status Provider

      ```python
      class RichStatusMessageProvider(dspy.streaming.StatusMessageProvider):
          def lm_start_status_message(self, instance, inputs): return "Calling AI..."
          def lm_end_status_message(self, outputs): return "Response received"
          def module_start_status_message(self, instance, inputs):
              return f"{type(instance).__name__}..."
          def module_end_status_message(self, outputs): return "Complete"
          def tool_start_status_message(self, instance, inputs): return "Tool..."
          def tool_end_status_message(self, outputs): return "Done"
      ```

      ## Utility Functions

      ### Server Management

      ```python
      def wait_for_server(base_url: str, timeout_s: float) -> bool:
          deadline = time.time() + timeout_s
          while time.time() < deadline:
              try:
                  if requests.get(f"{base_url}/health", timeout=3).status_code == 200:
                      return True
              except requests.exceptions.RequestException:
                  pass
              time.sleep(1)
          return False

