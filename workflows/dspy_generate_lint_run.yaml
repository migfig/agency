          # spawn subprocess with preexec_fn=os.setsid
          # Return proc

      def stop_server(proc: Any) -> None:
          # SIGTERM → wait 20s → SIGKILL fallback
      ```

      ### File Save

      ```python
      def save_post(final_post: str, topic: str) -> str:
          # Create blogs/ dir, timestamp filename, sanitize topic slug
          # Write "# {topic}\n\n{final_post}\n\n---\nGenerated: {iso_timestamp}"
          # Return filepath
      ```

      ## CLI Arguments

      | Argument | Type | Default |
      |---|---|---|
      | `--topic` | str | `"AI Ethics"` |
      | `--audience` | str | `"Developers"` |
      | `--tone` | str | `"Analytical"` |
      | `--length` | str | `"1000"` |
      | `--model` | str | `"openai/gemma-4-2b"` |
      | `--api-key` | str | `"sk-test"` |
      | `--base-url` | str | `"http://localhost:11435/v1"` |
      | `--cache` | str | `"false"` |
      | `--server-binary` | str | `"llama-cpp-server.sh"` |
      | `--server-extra-args` | str (nargs="+") | `["-r", "true", "-c", "8192"]` |

      ## Environment Defaults

      ```python
      os.environ.get("LITELLM_API_KEY", "sk-test")
      os.environ.get("LITELLM_BASE_TEST_URL", "http://localhost:11435/v1")
      os.environ.get("LITELLM_HOST_TEST", "localhost")
      os.environ.get("LITELLM_PORT_TEST", "11435")
      os.environ.get("LITELLM_CACHE", "false")
      ```

      ## dspy.LM Setup

      ```python
      lm = dspy.LM(model, api_key=api_key, base_url=base_url, cache=cache_bool)
      adapter = dspy.ChatAdapter()
      dspy.configure(lm=lm, adapter=adapter)
      ```

      ## main() Flow

      ```python
      def main():
          args = parse_args()
          proc = None
          try:
              # 1. Start server via start_server() with args
              # 2. Wait via wait_for_server(args.base_url, 60.0) — exit if timeout
              # 3. Configure dspy.LM + ChatAdapter
              # 4. Instantiate BlogPostPipeline
              # 5. Call pipeline.generate_post(topic, audience, tone, length)
              # 6. If result: save_post(), print filepath + content
              # 7. If empty: print failure message
          except KeyboardInterrupt:
              console.print("[bold red]Interrupted[/]")
              sys.exit(1)
          except Exception as e:
              console.print(f"[bold red]Error: {e}[/]")
              sys.exit(1)
          finally:
              if proc:
                  stop_server(proc)
      ```

      ## Expected Run

      ```bash
      python program.py --topic "AI Ethics" --audience Developers --tone Analytical --length 1000
      ```

      Output: `blogs/20260717_164628_ai_ethics.md` containing a polished markdown blog post.

      Rules: output ONLY the raw Python code - no markdown, no code
      fences, no explanation. Use single-quoted strings only; do not use
      double quotes or backslashes anywhere. The program must be lint-clean
      under ruff's default rules (no unused imports, no unused variables).
  save_program:
    id: save_program
    type: tool_call
    tool_name: save_program
    arguments_template: '{"name": "program", "content": "{{ nodes.generate.output }}"}'
  lint_python:
    id: lint_python
    type: tool_call
    tool_name: lint_python
    arguments_template: '{"file": "{{ nodes.save_program.output }}"}'
  run_python:
    id: run_python
    type: tool_call
    tool_name: run_python
    arguments_template: '{"file": "{{ nodes.save_program.output }}"}'
edges:
  - {from_id: generate, to_id: save_program}
  - {from_id: save_program, to_id: lint_python}
  - {from_id: lint_python, to_id: run_python}
